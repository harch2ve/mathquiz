<style>

<script>
const U=["2-1-2 여러가지도형","3-1-2 평면도형","4-1-2 각도","4-2-4 사각형","4-2-2 삼각형","4-2-6 다각형","3-2-3 원","4-1-4 평면도형의 이동","5-2-3 합동과 대칭","공간감각","5-2-5 직육면체","5-2-5 정육면체","6-1-2 각기둥","6-1-2 각뿔","6-2-6 원기둥","6-2-6 원뿔","6-2-6 구","6-2-3 공간과 입체"];
// 단원|질문|정답|키워드(쉼표=필수, /=대체어)
const D=`0|변|삼각형의 곧은 선|곧은,선
0|꼭짓점|삼각형의 두 곧은 선이 만나는 점|두,만나,점
1|점, 선[유]|부분이 없는 것, 폭이 없는 것|부분,없,폭
1|점, 선[학]|무정의 용어|무정의
1|선분[학]|두 점을 곧게 이은 선|두점,곧게/곧은
1|직선[유]|그 위에 놓여 있는 모든 점이 곧게 놓여 있는 선|모든점,곧게
1|직선[학]|선분을 양쪽으로 끝없이 늘인 곧은 선|선분,양쪽,끝없이
1|반직선[학]|한 점에서 시작하여 한쪽으로 끝없이 늘인 곧은 선|한점,시작,한쪽,끝없이
1|각[유]|평면각: 한 평면 위에서 서로 만나고 일직선이 되지 않는 두 선 사이의 기울기 (선들이 직선이면 직선각)|한평면,만나,일직선,기울기
1|각[학]|한 점에서 그은 두 반직선으로 이루어진 도형 (직선각만 다룸)|한점,두반직선
1|각의 구성요소와 조건[학]|구성요소: 꼭짓점, 변 / 조건: 두 반직선이 반드시 한 점에서 만나야 한다|꼭짓점,변,한점
1|직각[유]|두 직선이 만나서 생기는 서로 이웃한 각이 서로 같을 때, 이 같은 각 각각을 직각이라 한다|이웃한,같
1|직각[학]|종이를 반듯하게 두 번 접었을 때 생기는 각 (평각 180도를 수직이등분. 두 번째 접을 때 처음 접은 자리가 일치하게 접음)|두번,접
2|각도|변의 길이와 관계없이 두 변이 벌어진 정도|변의길이,벌어진
2|열각|크기가 180도보다 작은 각|180,작
2|우각|크기가 180도보다 큰 각|180,큰
2|예각|각도가 0도보다 크고 직각보다 작은 각|0도,크,직각,작
2|둔각|각도가 직각보다 크고 180도보다 작은 각|직각,크,180,작
2|1도|직각의 크기를 똑같이 90으로 나눈 것 중 하나의 각도|직각,90,나눈
3|수직|두 직선이 만나서 이루는 각이 직각일 때 두 직선은 서로 수직이다|두직선,직각
3|수선|두 직선이 서로 수직으로 만났을 때, 한 직선은 다른 직선에 대한 수선|수직,다른직선
3|각도기로 수선 긋기|각도기의 중심을 점에 맞추고 밑금을 직선에 맞춘다|중심,점,밑금,직선
3|평행|한 직선에 수직인 두 직선을 그었을 때 서로 만나지 않는 두 직선을 평행하다고 한다|수직,두직선,만나지
3|평행선|평행한 두 직선|평행,두직선
3|평행선 사이의 거리|평행선과 수직인 선분의 길이|수직,선분,길이
3|평행선 사이에서 길이가 가장 짧은 선분을 긋는 법|평행선의 한 직선에서 다른 직선에 수직인 선분을 긋는다|한직선,수직,선분
3|마름모의 마주보는 두 쌍의 변이 평행함을 입증하는 방법 2가지|삼각자 2개로 한 직선에 수직인 두 직선 확인 / 마주보는 두 변 사이에 수선 2개를 긋고 길이가 같은지 확인(평행선 사이의 거리는 같기 때문)|삼각자,수선,길이,같
3|꼬인 위치[유]|공간에서 두 직선이 서로 만나지도 않고 평행하지도 않을 때 (동일 평면으로 제한)|만나지,평행하지
3|삼각자를 이용해 그은 두 직선이 평행한 이유|왼쪽 삼각자의 한 변에 대해 먼저 그은 직선과 나중에 그은 직선이 각각 수직이 되므로|한변,수직
3|사다리꼴 분류기준과 정의|평행한 두 변의 유무 / 한 쌍의 변이 평행한 사각형|평행,한쌍
3|사다리꼴 개념 사이 위계적 관계|직각 → 수직 → 평행 → 사다리꼴|직각,수직,평행,사다리꼴
3|사다리꼴 활동(종이 띠 자르기)와 이유|직사각형 모양 종이 띠를 자르면 잘라낸 도형들은 모두 위와 아래의 변이 평행하기 때문|위,아래,평행
3|평행사변형 분류기준과 정의|평행한 두 변의 쌍의 수 / 두 쌍의 변이 평행한 사각형|두쌍,평행
3|평행사변형의 성질 4가지|마주보는 두 변의 길이가 같다 / 마주보는 두 각의 크기가 같다 / 이웃한 두 각의 크기의 합이 180도 / 모양과 크기가 같은 삼각형 2개로 나누어진다|마주보는두변,마주보는두각,180,삼각형
3|마름모 분류기준과 정의|변의 길이 / 네 변의 길이가 모두 같은 사각형|네변,같
3|마름모의 성질과 조건 3가지|마주보는 두 각의 크기가 같고 이웃한 두 각의 합이 180도(필요조건) / 대각선이 서로 수직으로 만나고 이등분(필요충분조건) / 마주보는 두 쌍의 변이 평행(필요조건)|마주보는두각,180,대각선,수직,이등분,평행
3|직사각형 분류기준과 정의|직각의 개수 / 네 각이 모두 직각인 사각형|네각,직각
3|직사각형 사고 수준과 이유|분석적 수준: 구성요소와 성질을 사용해 도형을 분류|분석적
3|직사각형의 성질 2가지|마주보는 두 변의 길이가 같다 / 마주보는 두 쌍의 변이 평행하다(한 직선에 수직인 두 직선은 평행, 연역·관계적)|마주보는두변,평행
3|정사각형 분류기준과 정의|네 변의 길이, 네 각의 크기 / 네 각이 모두 직각이고 네 변의 길이가 모두 같은 사각형|네각,직각,네변,같
3|정사각형의 성질 2가지|네 각이 모두 직각이다 / 네 변의 길이가 모두 같다|네각,직각,네변,같
3|변의 길이가 모두 같은 사각형이라고만 제시할 때 반례|마름모|마름모
3|각의 크기가 모두 같은 사각형이라고만 제시할 때 반례|네 변의 길이가 같지 않은 직사각형|직사각형
3|변의 길이가 같고 각이 직각인 사각형이라고만 제시할 때 반례|두 변의 길이만 같은 사각형 또는 두 각의 크기만 직각인 사각형|두변,두각
4|삼각형 분류 방법과 교육과정/원론 분류|변의 길이에 따른 분류는 계층적 분류, 각의 크기에 따른 분류는 분할적 분류 (원론의 이등변삼각형은 두 변만 같은 삼각형 = 분할적)|변의길이,계층적,각의크기,분할적
4|각의 크기보다 변의 길이에 따른 분류를 먼저 다루는 이유|선분과 반직선이 각보다 더 기본적인 도형 개념 / 각과 각도 개념은 반직선이 기본 / 선분 길이 측정을 각도 측정보다 먼저 학습|선분,기본,반직선,길이,먼저
4|이등변삼각형 정의|두 변의 길이가 같은 삼각형|두변,같
4|이등변삼각형 활동과 성질|자·각도기로 재어보기, 겹쳐서 자르기 → 길이가 같은 두 변에 있는 두 각의 크기가 같다|두각,같
4|정삼각형 정의|세 변의 길이가 같은 삼각형|세변,같
4|정삼각형 활동과 성질|각도기로 재어보기 → 세 각이 모두 60도 / 접어 겹쳐보기, 세 조각으로 찢어 세 각을 겹쳐보기 → 세 각의 크기가 같다|세각,60
1|직각삼각형 정의와 원격자 도형판 활동|한 각이 직각인 삼각형 / 원의 지름을 한 변으로 하는 삼각형을 만든다|한각,직각,지름
4|예각삼각형 정의와 원격자 도형판 활동|세 각이 모두 예각인 삼각형 / 원의 중심이 삼각형 내부에 있도록 만든다|세각,예각,중심,내부
4|둔각삼각형 정의와 원격자 도형판 활동|한 각이 둔각인 삼각형 / 원의 중심이 삼각형 외부에 있도록 만든다|한각,둔각,중심,외부
5|다각형[유]|3개 이상의 직선으로 둘러싸인 도형|3개,직선,둘러
5|다각형[학]과 조건 2가지|선분으로만 둘러싸인 도형 / 선분으로 이루어져 있어야 하고 닫혀 있어야 함|선분,닫혀
5|정다각형|변의 길이가 모두 같고 각의 크기가 모두 같은 다각형|변,같,각,같
5|정다각형으로 평면을 빈틈없이 채우는 조건|정다각형의 한 내각의 크기가 360도의 약수일 때|한내각,360,약수
5|대각선|다각형에서 서로 이웃하지 않는 두 꼭짓점을 이은 선분|이웃하지,두꼭짓점,선분
5|삼각형에 대각선을 그을 수 없는 이유|모든 꼭짓점이 서로 이웃하고 있기 때문|모든,꼭짓점,이웃
5|오각형 내각의 합 구하기(관계적 수준)|삼각형 세 각의 합 180도, 오각형은 삼각형 3개로 나뉘므로 180×3=540 (5개로 나누면 900-360=540)|삼각형,180,3,540
5|볼록다각형|모든 대각선이 다각형의 내부에 있다|모든대각선,내부
5|오목다각형|내각 중 크기가 180도보다 큰 각이 존재함, 대각선이 외부에 존재할 수 있음|180,큰각,외부
6|원[유]|원 안의 한 점으로부터 원주까지 그린 직선의 길이가 모두 같은 평면도형|한점,원주,길이,같
6|원[초등] 활동 3가지와 학년별 접근|신체·물건 / 누름못과 띠종이 / 자로 점을 찍어 원 그리기 (2학년 예시적 정의 → 3학년 구체적 경험, 비형식적 인식)|누름못,띠종이,자
6|원[중학교]|평면 위의 한 점 O에서 일정한 거리에 있는 점들의 모임|한점,일정한거리,점들
6|반지름[유]|중심으로부터 원주까지 그린 직선|중심,원주
6|지름[유]|중심을 지나서 양쪽으로 원주까지 그린 직선|중심,지나,양쪽,원주
6|원의 중심(누름못과 띠종이)|외연적: 누름못이 꽂혔던 점 / 내포적: 원 위의 모든 점에서 같은 거리에 있는 점|누름못,모든점,같은거리
6|반지름(누름못과 띠종이)|원의 중심과 원 위의 한 점을 이은 선분|중심,한점,선분
6|지름(누름못과 띠종이)|원의 중심을 지나도록 원 위의 두 점을 이은 선분|중심,지나,두점,선분
6|지름(원 모양 종이접기)|원을 완전히 포개지도록 반으로 접어서 생기는 선분|포개,반,접
6|원의 중심(종이접기)과 이유|두 지름이 만나는 점 / 접어서 생긴 선분들이 만나는 점과 원 위의 한 점 사이 길이가 모두 같기 때문|두지름,만나,같
6|반지름의 성질 2가지|반지름은 무수히 많다 / 한 원에서 반지름은 모두 같다|무수히,모두같

14|원기둥 전개도로 다루는 범위와 가로·세로|두 밑면에 수직인 선분을 따라 잘라 옆면이 직사각형이 되는 경우만 / 옆면의 세로=높이, 가로=밑면인 원의 둘레|직사각형,세로,높이,가로,둘레
14|원기둥의 성질|앞과 옆에서 본 모양이 직사각형이다|앞,옆,직사각형
14|앞·옆에서 본 모양을 직사각형이라고 지도하는 이유|빗원기둥은 다루지 않고 모선이 밑면에 수직인 직원기둥만 다루기 때문|빗원기둥,직원기둥
15|원뿔[유]|직각삼각형에서 직각을 끼고 있는 한 변을 중심으로 회전시켰을 때 생기는 도형|직각삼각형,직각,한변,회전
15|원뿔 정의|한 원을 면으로 하는 뿔 모양의 입체도형|한원,뿔모양
15|원뿔 밑면|평평한 면|평평
15|원뿔 옆면|밑면과 만나는 굽은 면 (학문수학: 모선이 모여 만들어지는 곡면)|굽은,모선
15|원뿔의 꼭짓점|뾰족한 부분의 점 (학문수학: 평면 밖의 한 점)|뾰족,평면밖
15|원뿔의 모선|원뿔의 꼭짓점과 밑면인 원의 둘레의 한 점을 이은 선분 (원기둥에도 있지만 원뿔에서만 정의)|꼭짓점,둘레,한점,선분
15|원뿔의 높이|원뿔의 꼭짓점에서 밑면에 수직인 선분의 길이|꼭짓점,수직,선분
15|원뿔의 높이 측정하기|꼭짓점에서 밑면까지 수직 선분의 길이를 곱자로 잰다 / 직각삼각자를 꼭짓점에 맞추고 자의 눈금 0에 밑면을 맞춰 직각으로 만나는 눈금을 읽는다|곱자,직각삼각자,눈금
15|모선의 길이 측정하기|자로 꼭짓점과 밑면 둘레의 한 점을 이은 선분의 길이를 잰다 / 자의 눈금 0에 밑면을 맞추고 꼭짓점까지 옆면의 길이를 잰다|꼭짓점,둘레,눈금
15|원뿔의 성질|앞과 옆에서 본 모양이 이등변삼각형이다|앞,옆,이등변삼각형
15|앞·옆에서 본 모양을 이등변삼각형이라고 지도하는 이유|꼭짓점과 밑면인 원의 중심을 이은 선분이 밑면에 수직인 직원뿔(회전체로서의 원뿔)만 다루기 때문|중심,수직,직원뿔
16|구[유]|반원을 지름을 중심으로 한 바퀴 돌렸을 때 생기는 회전체|반원,지름,한바퀴
16|구의 정의|반원을 지름을 기준으로 한 바퀴 돌려서 만든 입체도형|반원,지름,한바퀴
16|구의 중심|반원의 중심 / 구에서 가장 안쪽에 있는 점|반원,중심/가장안쪽
16|구의 반지름|반원의 반지름 / 구의 중심에서 구의 면의 한 점을 이은 선분|중심,면,한점,선분
16|구에는 모선이 있는가?|옆면이 없으므로 모선을 생각할 수 없다|옆면,없
16|구의 성질|구의 반지름은 모두 같고 무수히 많다. 구는 어느 쪽에서 보거나 관계없이 원으로 보인다|같,무수히,원
17|쌓기나무 4개로 만들 수 있는 모양 찾는 방법|쌓기나무 3개 모양에 1개를 더 붙여 만들고, 뒤집거나 돌려서 같은 모양은 같은 것으로 센다|하나,더,뒤집,돌려`.split("\n").map((l,i)=>{const[u,q,a,k]=l.split("|");return{id:i,u:+u,q,a,k:(k||"").split(",").filter(Boolean),s:+u>=9}});
const $=document.getElementById("app");const N=s=>s.replace(/[\s.,·\-~()\[\]'"’“”:;!?→×=]/g,"");
let nick="",S={done:{},wrong:{}},mode="",seen={},cur=null,graded=false;
const ld=k=>{try{return localStorage.getItem(k)}catch(e){return null}},sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const save=()=>sv("doq:"+nick,JSON.stringify(S));
function home(){const last=ld("doq:last")||"";$.innerHTML=`<h1>📐 도형 꼭 외워 퀴즈</h1><div class=card><div class=mu>닉네임을 입력하면 다음에도 이어서 학습해요</div><input id=nk value="${last}" placeholder="닉네임" maxlength=20 style="margin:10px 0"><button class=p style="width:100%" onclick="login()">시작하기</button></div>`;document.getElementById("nk").onkeydown=e=>e.key=="Enter"&&login()}
function login(){const v=document.getElementById("nk").value.trim();if(!v)return;nick=v;sv("doq:last",v);try{S=JSON.parse(ld("doq:"+v))||{done:{},wrong:{}}}catch(e){S={done:{},wrong:{}}}S.done=S.done||{};S.wrong=S.wrong||{};menu()}
function menu(){const c=s=>D.filter(d=>d.s==s),dn=s=>c(s).filter(d=>S.done[d.id]).length,w=Object.keys(S.wrong).length;
const b=(m,t,n,t2)=>`<button class=big onclick="start('${m}')"><b>${t}</b><div class=mu>${t2}</div>${n!=null?`<div class=bar><i style="width:${n}%"></i></div>`:""}</button>`;
$.innerHTML=`<h1>안녕하세요, ${nick}님 👋</h1><div class=mu>학습할 파트를 선택하세요</div>`+b("p","평면도형",Math.round(dn(0)/c(0).length*100),`${dn(0)} / ${c(0).length} 완료`)+b("s","입체도형",Math.round(dn(1)/c(1).length*100),`${dn(1)} / ${c(1).length} 완료`)+b("r","다시 보기 🔁",null,`틀린 개념 ${w}개`)+`<div class=row><button onclick="home()">닉네임 변경</button><button onclick="askReset()" style="color:var(--no)">기록 초기화</button></div><div id=rs></div>`}
let H=[],view=-1;
function start(m){mode=m;seen={};view=-1;S.log=S.log||{};H=mode=="r"?[]:D.filter(d=>d.s==(mode=="s")&&S.done[d.id]).map(d=>{const l=S.log[d.id];return l?{id:d.id,inp:l.inp,ok:l.ok,h:l.h}:{id:d.id,inp:"",ok:!S.wrong[d.id],h:null}});next()}
function askReset(){document.getElementById("rs").innerHTML=`<div class=card><b>${nick}님의 모든 기록(진도·틀린 개념)을 지울까요?</b><div class=row><button onclick="menu()">아니요</button><button class=p onclick="resetAll()">초기화</button></div></div>`}
function resetAll(){S={done:{},wrong:{},log:{}};save();menu()}
function pick(){if(mode=="r")return D.find(d=>S.wrong[d.id]&&!seen[d.id]);return D.find(d=>d.s==(mode=="s")&&!S.done[d.id])}
function prog(){if(mode=="r"){const i=Object.keys(seen).length;return[i,i+D.filter(d=>S.wrong[d.id]&&!seen[d.id]).length]}const L=D.filter(d=>d.s==(mode=="s"));return[L.filter(d=>S.done[d.id]).length,L.length]}
function pt(){return view==-1?(cur&&graded?H.length-2:H.length-1):view-1}
const pbtn=()=>`<div class=row><button onclick="prev()" ${pt()<0?'disabled style="opacity:.4"':''}>◀ 이전 문제</button></div>`;
function frame(h){const[i,n]=prog(),p=pt()<0;$.innerHTML=`<div class=row style="margin:0"><button onclick="menu()" style="flex:0">←</button><div class=mu style="align-self:center;flex:1;text-align:right">${nick} · ${i} / ${n}</div></div><div class=bar style="height:10px"><i style="width:${n?i/n*100:0}%"></i></div>`+h}
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function next(){view=-1;cur=pick();graded=false;if(!cur){const nm={p:"평면도형",s:"입체도형",r:"다시 보기"}[mode];frame(`<div class=card><h1>🎉 ${nm} 끝!</h1><div class=mu>${mode=="r"?"다시 볼 개념을 모두 확인했어요.":"모든 문제를 풀었어요. 처음부터 다시 풀 수도 있어요."}</div></div>${mode!="r"?`<button class=big onclick="reset()">처음부터 다시 풀기</button>`:""}<button class=big onclick="menu()">메뉴로</button>${pbtn()}`);return}render(null)}
function render(e){const d=e?D[e.id]:cur;let r;
if(e)r=`<div class="${e.ok?"ok":"no"}" style="margin-top:12px">${e.ok?"⭕ 정답!":"❌ 아쉬워요"} <span class=mu>${e.h==null?"":"(핵심어 "+e.h+"/"+d.k.length+")"}</span></div><div class=ans><b>정답</b><br>${d.a}</div><div class=row>${e.ok?"":`<button onclick="ovr()">내가 맞았어요</button>`}<button class=p onclick="fwd()">다음 →</button></div>`;
else r=`<div class=row><button id=sk onclick="grade()">모르겠어요</button><button class=p id=sb onclick="grade()">정답 확인</button></div>`;
frame(`<div class=card><span class=unit>${U[d.u]}</span><div class=q>${d.q}</div><textarea id=in rows=3 placeholder="정의를 입력하세요 (모르겠으면 빈 칸으로 Enter)" ${e?"readonly":""}>${e?esc(e.inp):""}</textarea>${r}${pbtn()}</div>`);
const t=document.getElementById("in");t.focus();t.onkeydown=ev=>{if(ev.key=="Enter"&&!ev.shiftKey){ev.preventDefault();e?fwd():grade()}}}
function grade(){if(graded||!cur)return;const raw=document.getElementById("in").value,v=N(raw),k=cur.k,h=k.filter(g=>g.split("/").some(x=>v.includes(N(x)))).length,ok=h>=Math.ceil(k.length*.7);
S.done[cur.id]=1;seen[cur.id]=1;(S.log=S.log||{})[cur.id]={inp:raw,ok,h};if(ok){if(mode=="r")delete S.wrong[cur.id]}else S.wrong[cur.id]=1;save();graded=true;const e={id:cur.id,inp:raw,ok,h};H.push(e);view=-1;render(e)}
function ovr(){const i=view==-1?H.length-1:view,e=H[i];e.ok=true;delete S.wrong[e.id];(S.log=S.log||{})[e.id]={inp:e.inp,ok:true,h:e.h};save();render(e)}
function prev(){const t=pt();if(t>=0){view=t;render(H[t])}}
function fwd(){if(view!=-1&&view<H.length-1){view++;render(H[view])}else next()}
function reset(){D.filter(d=>d.s==(mode=="s")).forEach(d=>delete S.done[d.id]);H=[];save();next()}
home();
</script></body></html>
